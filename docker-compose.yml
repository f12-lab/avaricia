services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - php
    networks:
      default:
        ipv4_address: 172.32.0.2

  php:
    image: php:latest
    container_name: php-fpm
    depends_on:
      - mysql
    networks:
      default:
        ipv4_address: 172.32.0.3

  mysql:
    build:
      context: ./mysql
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banco
    ports:
      - "3306:3306"
    networks:
      default:
        ipv4_address: 172.32.0.4

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16
